[project]
name = "fortuna-market-data"
version = "0.1.0"
description = "Script-driven Alpaca daily data snapshots for reproducible research."
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.13,<3", "pyarrow>=25,<26", "exchange-calendars>=4.11,<5", "pandas>=2.2,<3", "python-dotenv>=1,<2"]
[project.scripts]
fortuna-data = "fortuna_market_data.cli:main"
[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
python-preference = "only-managed"
